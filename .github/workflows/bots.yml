      - name: Spawn & Control Army
        env:
          CONTROL_URL: "https://me5years.alwaysdata.net/index.php?action=get"
        run: |
          set +e
          cd ddnet_folder
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 +extension GLX +render -noreset &
          sleep 2
          openbox & 
          sleep 2
          export LIBGL_ALWAYS_SOFTWARE=1

          if [ -f "../xray_config.json" ]; then
            ../xray -c ../xray_config.json > xray.log 2>&1 &
            sleep 3
            PROXY_CFG="cl_proxy_address 127.0.0.1
          cl_proxy_port 1080"
          else
            PROXY_CFG=""
          fi

          for i in {1..2}; do
            cat << EOF > "bot$i.cfg"
          cl_show_welcome 0
          cl_motd_time 0
          gfx_screen_width 640
          gfx_screen_height 480
          player_name "Panda_${{ matrix.instance }}_$i"
          cl_dummy_name "DUM_${{ matrix.instance }}_$i"
          cl_dummy 1
          cl_auto_ready 1
          snd_enable 0
          gfx_nwo_downscale 1
          $PROXY_CFG
          EOF
            ./DDNet -f "bot$i.cfg" > bot_debug.log 2>&1 &
            sleep 2
          done

          echo "Ожидание прогрузки..."
          sleep 15
          
          LAST_ID=$(curl -s --max-time 2 "$CONTROL_URL" | jq -r '.id // 0')

          while true; do
            RAW_RESPONSE=$(curl -s --max-time 1 "$CONTROL_URL")
            if echo "$RAW_RESPONSE" | jq -e . >/dev/null 2>&1; then
                ID=$(echo "$RAW_RESPONSE" | jq -r '.id // 0')
                if [[ "$ID" != "$LAST_ID" && "$ID" != "0" ]]; then
                  LAST_ID=$ID
                  TYPE=$(echo "$RAW_RESPONSE" | jq -r '.type')
                  VAL=$(echo "$RAW_RESPONSE" | jq -r '.value')
                  WIDS=$(xdotool search --class "DDNet" 2>/dev/null)
                  for WID in $WIDS; do
                    xdotool windowactivate --sync $WID 2>/dev/null
                    sleep 0.2
                    if [ "$TYPE" == "connect" ]; then
                      xdotool key --window $WID Escape; sleep 0.2
                      xdotool key --window $WID F1; sleep 0.5
                      xdotool type --window $WID --delay 20 "connect $VAL"
                      xdotool key --window $WID Return; sleep 0.5; xdotool key --window $WID F1
                    elif [ "$TYPE" == "chat" ]; then
                      xdotool key --window $WID t; sleep 0.3
                      xdotool type --window $WID --delay 15 "$VAL"
                      xdotool key --window $WID Return
                    fi
                  done
                fi
            fi
            sleep 1
          done
