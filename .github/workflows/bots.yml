name: CI-Debug
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Preparing Environment
        shell: pwsh
        run: |
          # Устанавливаем пароль
          $Password = "YourStrongPass123!"
          $User = "runneradmin"
          $PasswordSecure = ConvertTo-SecureString $Password -AsPlainText -Force
          Set-LocalUser -Name $User -Password $PasswordSecure
          
          # Включаем RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Install Tunnel
        shell: pwsh
        run: |
          # Используем Chocolatey для установки ngrok, чтобы не качать экшены
          choco install ngrok
          
      - name: Start Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok authtoken $env:NGROK_AUTH_TOKEN
          # Запуск в фоновом режиме через старт-процесс
          Start-Process ngrok -ArgumentList "tcp 3389"
          
          # Ждем немного, чтобы туннель поднялся, и выводим адрес
          Start-Sleep -Seconds 10
          $tunnels = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
          Write-Host "--- ПОДКЛЮЧАЙСЯ ТУТ: ---"
          Write-Host $tunnels.tunnels.public_url
          Write-Host "------------------------"

      - name: Keep Alive
        shell: pwsh
        run: |
          # Не даем виртуалке выключиться 6 часов
          while ($true) { Start-Sleep -Seconds 3600 }
