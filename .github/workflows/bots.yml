name: Windows RDP (Ngrok)
on: workflow_dispatch # Запуск вручную через вкладку Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup RDP
        uses: NyaMisty/reverse-rdp-windows-github-actions-ng@master
        with:
          ngrok-token: ${{ secrets.NGROK_AUTH_TOKEN }}
          password: 123123123 # Придумай пароль для входа
